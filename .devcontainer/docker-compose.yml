version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/saas:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data-saas:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saas_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-saas:
